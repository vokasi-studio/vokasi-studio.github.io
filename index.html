<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokasi Studio</title>
<meta name="description" content="Vokasi Studio — ink, pixels and bad ideas. Indie games and apps.">
<style>
  :root { --bg:#16130f; --fg:#f2ece4; --dim:#9a9086; --red:#e0483e; --amber:#f2b33d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding:48px 24px; text-align:center; }
  .logo { width:180px; height:180px; border-radius:50%; background:#fff; object-fit:contain; padding:12px; }
  h1 { margin-top:28px; font-size:28px; letter-spacing:.08em; text-transform:uppercase; }
  .tag { margin-top:10px; color:var(--dim); font-size:16px; }
  .tag .jp { color:var(--red); }
  .apps { margin-top:40px; display:flex; flex-direction:column; gap:12px; width:100%; max-width:360px; }
  .apps a, .apps span { display:block; padding:14px 18px; border:1px solid #3a332b; border-radius:14px;
                        color:var(--fg); text-decoration:none; }
  .apps a:hover { border-color:var(--amber); }
  .apps small { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  footer { margin-top:48px; color:var(--dim); font-size:13px; }
  footer a { color:var(--amber); text-decoration:none; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Vokasi Studio">
  <h1>Vokasi Studio</h1>
  <p class="tag">Ink, pixels and bad ideas ｜ <span class="jp">墨とピクセルとバカなアイデア</span></p>

  <div class="apps">
    <span>Kasi Cam<small>Retro film camera — coming soon</small></span>
    <a href="https://play.google.com/store/apps/details?id=com.isakovstudio.superstorm">SUPER STORM<small>Hardcore parkour — Google Play</small></a>
  </div>

  <footer><a href="mailto:vokasi.studio@gmail.com">vokasi.studio@gmail.com</a></footer>
</body>
</html>
