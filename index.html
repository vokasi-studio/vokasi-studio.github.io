<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vokasi Studio</title>
<meta name="description" content="Vokasi Studio — ink, pixels and bad ideas. Indie games and apps.">
<style>
  :root { --bg:#16130f; --fg:#f2ece4; --dim:#9a9086; --line:#3a332b; --red:#e0483e; --amber:#f2b33d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:var(--bg); color:var(--fg); font-family:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         padding:48px 24px; text-align:center; }
  .logo { width:180px; height:180px; border-radius:50%; background:#fff; object-fit:contain; padding:12px; }
  h1 { margin-top:28px; font-size:28px; letter-spacing:.08em; text-transform:uppercase; }
  /* Слоган: EN и JP — каждый целиком; на узком экране JP уходит на свою строку, без обрезки */
  .tag { margin-top:10px; color:var(--dim); font-size:16px; line-height:1.5; }
  .tag span { display:inline-block; white-space:nowrap; }
  .tag .sep { margin:0 6px; }
  .tag .jp { color:var(--red); }
  @media (max-width:520px) { .tag .sep { display:none; } .tag span { display:block; } }
  .apps { margin-top:40px; display:flex; flex-direction:column; gap:12px; width:100%; max-width:380px; }
  .app { padding:16px 18px; border:1px solid var(--line); border-radius:14px; }
  .app b { display:block; }
  .app small { display:block; color:var(--dim); font-size:12px; margin-top:2px; }
  .stores { display:flex; gap:8px; margin-top:12px; }
  .stores a, .stores span { flex:1; padding:9px 10px; border:1px solid var(--line); border-radius:10px;
                            font-size:14px; color:var(--fg); text-decoration:none; }
  .stores a:hover { border-color:var(--amber); }
  .stores span { color:var(--dim); border-style:dashed; }
  footer { margin-top:48px; color:var(--dim); font-size:13px; }
  footer a { color:var(--amber); text-decoration:none; }
</style>
</head>
<body>
  <img class="logo" src="logo.png" alt="Vokasi Studio">
  <h1>Vokasi Studio</h1>
  <p class="tag"><span>Ink, pixels and bad ideas</span><span class="sep">｜</span><span class="jp">墨とピクセルとバカなアイデア</span></p>

  <div class="apps">
    <div class="app">
      <b>Kasi Cam</b><small>Retro film camera</small>
      <div class="stores">
        <a href="https://play.google.com/store/apps/details?id=com.vokasistudio.kasicam">Google Play</a>
        <span>RuStore — soon</span>
      </div>
    </div>
    <div class="app">
      <b>SUPER STORM</b><small>Hardcore parkour</small>
      <div class="stores">
        <a href="https://play.google.com/store/apps/details?id=com.isakovstudio.superstorm">Google Play</a>
        <a href="https://www.rustore.ru/catalog/app/com.isakovstudio.superstorm">RuStore</a>
      </div>
    </div>
  </div>

  <footer><a href="mailto:vokasi.studio@gmail.com">vokasi.studio@gmail.com</a></footer>
</body>
</html>
